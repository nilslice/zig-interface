name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-example:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Requires Zig 0.17+. Builds against 0.16 or 0.15 should use a pinned compatible release.
        zig-version: ["0.17.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check Zig Version
        run: zig version

      - name: Run tests
        run: zig build test
